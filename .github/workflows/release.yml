name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/gnome-extension/package-lock.json

      - name: Install JS dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/gnome-extension

      - name: Run GNOME extension tests and validations
        run: |
          npm test
          glib-compile-schemas --strict --dry-run schemas
          bash -n scripts/install-local.sh scripts/install-hopd-local.sh scripts/package-extension.sh scripts/bump-version.sh
        working-directory: apps/gnome-extension

      - name: Run hopd tests
        run: cargo test
        working-directory: crates/hopd

      - name: Run hop-hotkeyd tests
        run: cargo test
        working-directory: crates/hop-hotkeyd

      - name: Run GTK launcher tests
        run: cargo test --features gtk_ui
        working-directory: apps/gtk-launcher

      - name: Build daemon binaries
        run: |
          cargo build --release --manifest-path crates/hopd/Cargo.toml
          cargo build --release --manifest-path crates/hop-hotkeyd/Cargo.toml

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-cargo cargo rustc dpkg-dev

      - name: Build Debian packages
        run: |
          cd crates/hopd && dpkg-buildpackage -us -uc -b
          cd ../hop-hotkeyd && dpkg-buildpackage -us -uc -b

      - name: Package daemon artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp crates/hopd/target/release/hopd dist/hopd
          cp crates/hopd/target/release/kde-hopd-query dist/kde-hopd-query
          cp crates/hop-hotkeyd/target/release/hop-hotkeyd dist/hop-hotkeyd
          tar -C dist -czf dist/hopd-linux-x86_64.tar.gz hopd
          tar -C dist -czf dist/kde-hopd-query-linux-x86_64.tar.gz kde-hopd-query
          tar -C dist -czf dist/hop-hotkeyd-linux-x86_64.tar.gz hop-hotkeyd
          mkdir -p dist/deb
          find crates -maxdepth 2 -type f -name '*.deb' -exec cp {} dist/deb/ \;

      - name: Build distributable zip
        run: npm run package
        working-directory: apps/gnome-extension

      - name: Resolve release asset path
        id: asset
        shell: bash
        run: |
          asset_path="$(ls apps/gnome-extension/dist/*.zip | head -n 1)"
          if [[ -z "${asset_path}" ]]; then
            echo "No zip file found in apps/gnome-extension/dist/." >&2
            exit 1
          fi
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Verify release artifact manifest
        shell: bash
        run: |
          bash scripts/release/verify-artifacts.sh dist/ARTIFACT_MANIFEST.txt \
            dist/hopd-linux-x86_64.tar.gz \
            dist/kde-hopd-query-linux-x86_64.tar.gz \
            dist/hop-hotkeyd-linux-x86_64.tar.gz \
            dist/deb \
            "${{ steps.asset.outputs.asset_path }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hop-launcher-release-assets
          path: |
            ${{ steps.asset.outputs.asset_path }}
            dist/hopd-linux-x86_64.tar.gz
            dist/kde-hopd-query-linux-x86_64.tar.gz
            dist/hop-hotkeyd-linux-x86_64.tar.gz
            dist/deb/*.deb
            dist/ARTIFACT_MANIFEST.txt
          if-no-files-found: error

      - name: Create GitHub release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main
          target_commitish: main
          name: Main build
          prerelease: true
          overwrite_files: true
          files: |
            ${{ steps.asset.outputs.asset_path }}
            dist/hopd-linux-x86_64.tar.gz
            dist/kde-hopd-query-linux-x86_64.tar.gz
            dist/hop-hotkeyd-linux-x86_64.tar.gz
            dist/deb/*.deb
            dist/ARTIFACT_MANIFEST.txt
          generate_release_notes: true
