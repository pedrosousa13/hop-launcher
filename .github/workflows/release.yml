name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual release (for example v0.1.0)"
        required: true
        default: "v0.0.0-dev"
      prerelease:
        description: "Mark manual release as prerelease"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Run verify/build/release asset generation but skip distro publishing"
        required: true
        type: boolean
        default: true
      build_appimage:
        description: "Build and upload AppImage artifact"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hopd tests
        run: cargo test
        working-directory: crates/hopd

      - name: Run hop-hotkeyd tests
        run: cargo test
        working-directory: crates/hop-hotkeyd

      - name: Run GTK launcher tests
        run: cargo test --features gtk_ui
        working-directory: apps/gtk-launcher

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-cargo cargo rustc dpkg-dev

      - name: Build Debian packages
        run: |
          cd crates/hopd && dpkg-buildpackage -us -uc -b
          cd ../hop-hotkeyd && dpkg-buildpackage -us -uc -b

      - name: Verify release helper scripts syntax
        run: |
          bash -n scripts/release/verify-artifacts.sh
          bash -n scripts/release/generate-checksums.sh
          bash -n scripts/release/publish-launchpad.sh
          bash -n scripts/release/publish-copr.sh
          bash -n scripts/release/build-appimage.sh
          test -f packaging/rpm/hopd.spec
          test -f packaging/rpm/hop-hotkeyd.spec
          test -f packaging/appimage/hop-launcher.desktop

  build_release:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_appimage) }}
        run: |
          chmod +x scripts/release/build-appimage.sh
          bash scripts/release/build-appimage.sh

      - name: Setup Rust targets
        run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Build daemon binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu --manifest-path crates/hopd/Cargo.toml
          cargo build --release --target aarch64-unknown-linux-gnu --manifest-path crates/hopd/Cargo.toml
          cargo build --release --target x86_64-unknown-linux-gnu --manifest-path crates/hop-hotkeyd/Cargo.toml
          cargo build --release --target aarch64-unknown-linux-gnu --manifest-path crates/hop-hotkeyd/Cargo.toml

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-cargo cargo rustc dpkg-dev

      - name: Build Debian packages
        run: |
          cd crates/hopd && dpkg-buildpackage -us -uc -b
          cd ../hop-hotkeyd && dpkg-buildpackage -us -uc -b

      - name: Package daemon artifacts
        shell: bash
        run: |
          mkdir -p dist

          cp crates/hopd/target/x86_64-unknown-linux-gnu/release/hopd dist/hopd-x86_64
          cp crates/hopd/target/x86_64-unknown-linux-gnu/release/kde-hopd-query dist/kde-hopd-query-x86_64
          cp crates/hop-hotkeyd/target/x86_64-unknown-linux-gnu/release/hop-hotkeyd dist/hop-hotkeyd-x86_64
          tar -C dist -czf dist/hopd-linux-x86_64.tar.gz hopd-x86_64
          tar -C dist -czf dist/kde-hopd-query-linux-x86_64.tar.gz kde-hopd-query-x86_64
          tar -C dist -czf dist/hop-hotkeyd-linux-x86_64.tar.gz hop-hotkeyd-x86_64

          cp crates/hopd/target/aarch64-unknown-linux-gnu/release/hopd dist/hopd-aarch64
          cp crates/hopd/target/aarch64-unknown-linux-gnu/release/kde-hopd-query dist/kde-hopd-query-aarch64
          cp crates/hop-hotkeyd/target/aarch64-unknown-linux-gnu/release/hop-hotkeyd dist/hop-hotkeyd-aarch64
          tar -C dist -czf dist/hopd-linux-aarch64.tar.gz hopd-aarch64
          tar -C dist -czf dist/kde-hopd-query-linux-aarch64.tar.gz kde-hopd-query-aarch64
          tar -C dist -czf dist/hop-hotkeyd-linux-aarch64.tar.gz hop-hotkeyd-aarch64

          mkdir -p dist/deb
          find crates -maxdepth 2 -type f -name '*.deb' -exec cp {} dist/deb/ \;

      - name: Verify release artifact manifest
        shell: bash
        run: |
          bash scripts/release/verify-artifacts.sh dist/ARTIFACT_MANIFEST.txt \
            dist \
            dist/deb

      - name: Generate release checksums
        shell: bash
        run: |
          bash scripts/release/generate-checksums.sh dist/SHA256SUMS \
            dist \
            dist/deb \
            dist/ARTIFACT_MANIFEST.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hop-launcher-release-assets
          path: |
            dist/*linux-*.tar.gz
            dist/hop-launcher-gtk-linux-x86_64.AppImage
            dist/deb/*.deb
            dist/ARTIFACT_MANIFEST.txt
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          overwrite_files: false
          files: |
            dist/*linux-*.tar.gz
            dist/deb/*.deb
            dist/ARTIFACT_MANIFEST.txt
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Upload AppImage to GitHub release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_appimage) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          overwrite_files: false
          files: |
            dist/hop-launcher-gtk-linux-x86_64.AppImage

  publish_launchpad:
    runs-on: ubuntu-latest
    needs: [verify, build_release]
    if: ${{ needs.verify.result == 'success' && needs.build_release.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && secrets.LAUNCHPAD_PPA != '' && secrets.LAUNCHPAD_GPG_PRIVATE_KEY != '' && secrets.LAUNCHPAD_GPG_PASSPHRASE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Launchpad publish dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dput devscripts debhelper dh-cargo cargo rustc dpkg-dev gnupg

      - name: Import Launchpad GPG key
        shell: bash
        env:
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          LAUNCHPAD_GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          echo "$LAUNCHPAD_GPG_PRIVATE_KEY" | gpg --batch --import
          # Prime gpg-agent for non-interactive signing attempts.
          echo "test" | gpg --batch --yes --pinentry-mode loopback --passphrase "$LAUNCHPAD_GPG_PASSPHRASE" --clearsign >/dev/null

      - name: Publish source packages to Launchpad
        shell: bash
        env:
          LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA }}
          LAUNCHPAD_DPUT_HOST: ${{ secrets.LAUNCHPAD_DPUT_HOST }}
          RELEASE_TAG: ${{ needs.build_release.outputs.release_tag }}
        run: bash scripts/release/publish-launchpad.sh

  publish_copr:
    runs-on: ubuntu-latest
    needs: [verify, build_release]
    if: ${{ needs.verify.result == 'success' && needs.build_release.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && secrets.COPR_CONFIG != '' && secrets.COPR_OWNER != '' && secrets.COPR_PROJECT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install COPR CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user copr-cli

      - name: Configure COPR credentials
        shell: bash
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Publish packages to COPR
        shell: bash
        env:
          COPR_OWNER: ${{ secrets.COPR_OWNER }}
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
          COPR_CHROOTS: ${{ secrets.COPR_CHROOTS }}
          RELEASE_TAG: ${{ needs.build_release.outputs.release_tag }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/release/publish-copr.sh

  release_summary:
    runs-on: ubuntu-latest
    needs: [verify, build_release, publish_launchpad, publish_copr]
    if: ${{ always() }}
    steps:
      - name: Summarize release channel status
        shell: bash
        run: |
          echo "dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"
          echo "verify=${{ needs.verify.result }}"
          echo "build_release=${{ needs.build_release.result }}"
          echo "publish_launchpad=${{ needs.publish_launchpad.result }}"
          echo "publish_copr=${{ needs.publish_copr.result }}"

          if [[ "${{ needs.verify.result }}" != "success" || "${{ needs.build_release.result }}" != "success" ]]; then
            echo "Core release failed before distro publish stages." >&2
            exit 1
          fi

          launchpad_status="${{ needs.publish_launchpad.result }}"
          copr_status="${{ needs.publish_copr.result }}"

          if [[ "${launchpad_status}" == "failure" || "${copr_status}" == "failure" ]]; then
            echo "Partial release: at least one distro publish stage failed." >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry-run mode: distro publish stages were intentionally skipped."
            exit 0
          fi

          echo "Release pipeline completed without distro publish failures."
