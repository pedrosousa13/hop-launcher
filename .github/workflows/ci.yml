name: CI

on:
  pull_request:
  push:
    branches: [main, master, work]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Run fuzzy matcher tests
        run: npm test

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas

      - name: Validate metadata version shape
        run: bash scripts/bump-version.sh --check

      - name: Detect metadata changes in pull request
        id: metadata_changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Fxq "metadata.json"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce monotonic version when metadata.json is modified
        if: github.event_name == 'pull_request' && steps.metadata_changes.outputs.changed == 'true'
        run: bash scripts/bump-version.sh --check-bump-against "origin/${{ github.base_ref }}"

      - name: Validate helper scripts syntax
        run: bash -n scripts/install-local.sh scripts/package-extension.sh scripts/bump-version.sh
