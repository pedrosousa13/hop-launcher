name: CI

on:
  pull_request:
  push:
    branches: [main, master, work]

jobs:
  hopd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hopd tests
        run: cargo test
        working-directory: crates/hopd

      - name: Run hopd benchmark snapshot
        shell: bash
        run: |
          mkdir -p artifacts/bench
          cargo run --bin hopd-bench -- 150 | tee artifacts/bench/hopd-bench.txt
        working-directory: crates/hopd

      - name: Download previous hopd benchmark baseline
        id: hopd-bench-baseline
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: ci.yml
          branch: ${{ github.ref_name }}
          name: hopd-bench
          path: crates/hopd/artifacts/bench/baseline
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Validate hopd benchmark guardrails
        shell: bash
        run: bash scripts/check-bench-thresholds.sh artifacts/bench/hopd-bench.txt
        working-directory: crates/hopd

      - name: Generate hopd benchmark summary report
        shell: bash
        run: |
          baseline_report="artifacts/bench/baseline/hopd-bench.txt"
          if [[ -f "$baseline_report" ]]; then
            bash scripts/bench-trend-report.sh artifacts/bench/hopd-bench.txt "$baseline_report" > artifacts/bench/hopd-bench-summary.md
          else
            bash scripts/bench-trend-report.sh artifacts/bench/hopd-bench.txt > artifacts/bench/hopd-bench-summary.md
          fi
        working-directory: crates/hopd

      - name: Upload hopd benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: hopd-bench
          path: |
            crates/hopd/artifacts/bench/hopd-bench.txt
            crates/hopd/artifacts/bench/hopd-bench-summary.md
          if-no-files-found: error

  hop-hotkeyd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hop-hotkeyd tests
        run: cargo test
        working-directory: crates/hop-hotkeyd

  gtk-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run GTK launcher tests
        run: cargo test --features gtk_ui
        working-directory: apps/gtk-launcher

  deb-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-cargo cargo rustc dpkg-dev

      - name: Build hopd .deb
        run: dpkg-buildpackage -us -uc -b
        working-directory: crates/hopd

      - name: Build hop-hotkeyd .deb
        run: dpkg-buildpackage -us -uc -b
        working-directory: crates/hop-hotkeyd

      - name: Collect .deb artifacts
        shell: bash
        run: |
          mkdir -p dist/deb
          find crates -maxdepth 2 -type f -name '*.deb' -exec cp {} dist/deb/ \;
          ls -la dist/deb

      - name: Verify .deb artifact manifest
        shell: bash
        run: |
          bash scripts/release/verify-artifacts.sh dist/manifest/deb.txt dist/deb

      - name: Verify distro publish scripts syntax
        shell: bash
        run: |
          bash -n scripts/release/publish-launchpad.sh
          bash -n scripts/release/publish-copr.sh
          bash -n scripts/release/build-appimage.sh
          test -f packaging/rpm/hopd.spec
          test -f packaging/rpm/hop-hotkeyd.spec
          test -f packaging/appimage/hop-launcher.desktop

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hop-launcher-deb
          path: dist/deb/*.deb
          if-no-files-found: error
