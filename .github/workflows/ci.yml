name: CI

on:
  pull_request:
  push:
    branches: [main, master, work]

jobs:
  gnome-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/gnome-extension/package-lock.json

      - name: Install JS dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/gnome-extension

      - name: Run fuzzy matcher tests
        run: npm test
        working-directory: apps/gnome-extension

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas
        working-directory: apps/gnome-extension

      - name: Validate helper scripts syntax
        run: bash -n scripts/install-local.sh scripts/install-hopd-local.sh scripts/package-extension.sh scripts/bump-version.sh
        working-directory: apps/gnome-extension

      - name: Build distributable zip
        run: npm run package
        working-directory: apps/gnome-extension

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: hop-launcher-zip
          path: apps/gnome-extension/dist/*.zip
          if-no-files-found: error

  hopd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hopd tests
        run: cargo test
        working-directory: crates/hopd

  hop-hotkeyd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hop-hotkeyd tests
        run: cargo test
        working-directory: crates/hop-hotkeyd

  gtk-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run GTK launcher tests
        run: cargo test
        working-directory: apps/gtk-launcher

  deb-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-cargo cargo rustc dpkg-dev

      - name: Build hopd .deb
        run: dpkg-buildpackage -us -uc -b
        working-directory: crates/hopd

      - name: Build hop-hotkeyd .deb
        run: dpkg-buildpackage -us -uc -b
        working-directory: crates/hop-hotkeyd

      - name: Collect .deb artifacts
        shell: bash
        run: |
          mkdir -p dist/deb
          find crates -maxdepth 2 -type f -name '*.deb' -exec cp {} dist/deb/ \;
          ls -la dist/deb

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hop-launcher-deb
          path: dist/deb/*.deb
          if-no-files-found: error
